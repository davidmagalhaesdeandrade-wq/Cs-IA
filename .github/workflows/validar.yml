name: Validar projeto
on:
  push:
    branches:
      - feature/visual-mobile-overhaul
  pull_request:
    branches:
      - main
jobs:
  validar:
    name: Compilar e verificar tipos
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar TypeScript e compilar
        run: npm run build
